name: land-title
services:
  neo4j:
    image: neo4j:5-enterprise
    ports:
      - "127.0.0.1:${LANDTITLE_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${LANDTITLE_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/landtitle
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    # The graph is rebuilt from cypher/ on every test run, so nothing needs to
    # survive a restart. tmpfs keeps the image's declared volumes off disk;
    # stop with `docker compose down -v` all the same.
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 2s
      timeout: 2s
      retries: 30
